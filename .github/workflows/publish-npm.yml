# Trusted publisher workflow (OIDC). Only this filename may be registered on npmjs.com.
# See docs/contributing/git-workflow.md for setup.
name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      channel:
        description: Dist-tag to publish
        required: true
        type: choice
        options:
          - latest
          - next
        default: latest
      git_ref:
        description: Tag or ref to publish (e.g. v4.1.0, main, or release-please branch)
        required: true
        default: main
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # next → npm-prerelease; latest (release event or manual) → npm-release.
    # Required reviewers on npm-release also gate automatic Release Please publishes.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'next' && 'npm-prerelease' || 'npm-release' }}
    steps:
      - name: Resolve publish target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install modules
        run: npm ci

      - name: Resolve publish version
        id: version
        run: |
          CHANNEL="${{ steps.target.outputs.channel }}"
          BASE=$(node -p "require('./package.json').version")

          if [ "$CHANNEL" = "next" ]; then
            PREFIX="${BASE}-next."
            MAX_N=0
            if VERSIONS=$(npm view lbh-frontend versions --json 2>/dev/null); then
              MAX_N=$(echo "$VERSIONS" | jq --arg p "$PREFIX" '
                [.[] | select(startswith($p)) | .[$p | length:] | select(test("^[0-9]+$")) | tonumber]
                | max // 0
              ')
            fi
            VERSION="${BASE}-next.$((MAX_N + 1))"
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
          else
            VERSION="${BASE}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing lbh-frontend@${VERSION} (dist-tag ${CHANNEL}) from ${{ steps.target.outputs.ref }}"

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.target.outputs.channel }}"

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.target.outputs.channel }}"
          REF="${{ steps.target.outputs.ref }}"
          {
            echo "### Package published (trusted publisher / OIDC)"
            echo ""
            echo "- **Version:** \`${VERSION}\`"
            echo "- **Dist-tag:** \`${CHANNEL}\`"
            echo "- **Ref:** \`${REF}\`"
            echo ""
            echo "\`npm install lbh-frontend@${VERSION}\`"
            echo ""
            echo "Or: \`npm install lbh-frontend@${CHANNEL}\`"
          } >> "$GITHUB_STEP_SUMMARY"
