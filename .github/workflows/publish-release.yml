# Maintainer-triggered production publish with approval gate.
# Use when Release Please did not publish (e.g. hotfix) or to republish from a tag.
name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Tag or ref to publish as latest (e.g. v3.7.1 or main)
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  publish-release:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install modules
        run: npm ci

      - name: Confirm version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Publishing lbh-frontend@${VERSION} to latest from ref ${{ inputs.git_ref }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          echo "### Release published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dist-tag:** \`latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** \`${{ inputs.git_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm install lbh-frontend@${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Or: \`npm install lbh-frontend@latest\`" >> "$GITHUB_STEP_SUMMARY"
